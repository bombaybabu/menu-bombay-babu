name: Actualizar carta Bombay Babu

on:
  schedule:
    # 06:00 UTC ≈ 07:00/08:00 hora de Canarias según horario de verano/invierno
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar monitor de carta
        id: run_monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          cd scripts
          python main.py | tee /tmp/monitor_output.log
          STATUS=$?
          if grep -q "::MENU_CHANGED::" /tmp/monitor_output.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          exit $STATUS

      - name: Subir capturas de depuración si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: scripts/debug/
          if-no-files-found: ignore

      - name: Commit y push si hubo cambios
        if: steps.run_monitor.outputs.changed == 'true'
        run: |
          git config user.name "bombay-babu-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html scripts/snapshots/previous.json
          git commit -m "Actualiza la carta automáticamente ($(date -u +'%Y-%m-%d'))"
          git push
