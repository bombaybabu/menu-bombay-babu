     function detectmob()
     { 
     if( navigator.userAgent.match(/Android/i)
     || navigator.userAgent.match(/webOS/i)
     || navigator.userAgent.match(/iPhone/i)
                     || navigator.userAgent.match(/iPad/i)

             } else {

            }

    function GetURLParameter(sParam)
    {

 function httpGetCustomerId(shopId,callback)
{
  var  url='https://cloudlicense02.hiopos.com/eRestPortal/portalerest/portal/getShop?s='+shopId+'&l=es';  
  var xmlHttp = new XMLHttpRequest();
    xmlHttp.onreadystatechange = function() { 
     
        if (xmlHttp.readyState == 4 && xmlHttp.status == 200){
          var jsonResponse = JSON.parse(xmlHttp.responseText);
          var customerID = jsonResponse.idClientDB;
          callback(customerID);
        }
           
    }
    xmlHttp.open("GET", url, true); // true for asynchronous 
    xmlHttp.send(null);
}

function httpGetRoot(params,callback)
{
  var encodedParams = encodeURIComponent(params);
  var  url='https://cloudlicense02.hiopos.com/eRestPortal/portalerest/portal/getRoute?params='+encodedParams;  
  var xmlHttp = new XMLHttpRequest();
    xmlHttp.onreadystatechange = function() { 
     
        if (xmlHttp.readyState == 4 && xmlHttp.status == 200){
          var response = xmlHttp.responseText;
          callback(response);
        }
           
    }
    xmlHttp.open("GET", url, true); // true for asynchronous 
    xmlHttp.send(null);
}
