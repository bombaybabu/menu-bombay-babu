<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --bg:#7a1a5a;
  --accent:#c0003c;
  --panel-orange:rgba(210, 85, 30, 0.94);
  --panel-magenta:rgba(180, 30, 100, 0.94);
  --panel-yellow:#c8962a;
  --panel-green:#5a8a28;
  --panel-blue:#1f6b8a;
  --panel-red:#c13c3c;
  --text:#fff;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x:hidden;
}

a, a:hover, a:visited, a:active{ text-decoration:none !important; }
a{ transition: color .2s ease, background-color .2s ease, opacity .2s ease; }

/* ============ HERO ============ */
.hero{
  position:relative;
  width:100%;
  min-height:310px;
  overflow:visible;
  padding-top:12px;
}
.hero-reserve-badge{
  position:absolute;
  top:-25px; left:50%;
  transform:translateX(-50%);
  width:68px; height:68px;
  background:var(--accent);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  text-align:center; z-index:3;
}
.hero-reserve-badge span{
  font-size:8.5px; font-weight:bold; letter-spacing:.1em;
  text-transform:uppercase; color:#fff; line-height:1.3;
}
.hero-reserve-badge:hover{ background:#fff; }
.hero-reserve-badge:hover span{ color:#000; }

.hero-panels{
  position:absolute; bottom:0; left:50%;
  transform:translateX(-50%);
  display:flex; width:760px; max-width:100%; z-index:2;
}
.panel-orange, .panel-magenta{ position:relative; overflow:hidden; }

.panel-orange{
  background:var(--panel-orange);
  flex:1.6;
  padding:28px 30px 24px;
}
.panel-orange::after{
  content:''; position:absolute; top:0; right:0;
  width:60px; height:60px;
  background:rgba(230,130,40,.4);
  clip-path:polygon(100% 0, 0 0, 100% 100%);
}
.panel-orange > *{ position:relative; z-index:1; }
.panel-orange .eyebrow{
  font-size:9px; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.78); margin-bottom:10px;
}
.panel-orange h1{
  font-size:21px; font-weight:bold; letter-spacing:.14em;
  text-transform:uppercase; line-height:1.25; margin-bottom:14px;
}
.panel-orange p{
  font-size:10.5px; line-height:1.65; color:rgba(255,255,255,.92); margin-bottom:8px;
}

.panel-magenta{
  background:var(--panel-magenta);
  flex:.75;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; text-align:center; color:#fff;
}
.panel-magenta > *{ position:relative; z-index:1; }
.panel-magenta:hover{ background:#fff; }
.panel-magenta:hover .find-us-label, .panel-magenta:hover h2{ color:#000; }
.panel-magenta .find-us-label{
  font-size:9px; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.78); margin-bottom:10px;
}
.panel-magenta .find-us-divider{
  width:36px; height:1px; background:rgba(255,255,255,.42); margin:0 auto 14px;
}
.panel-magenta:hover .find-us-divider{ background:#000; }
.panel-magenta h2{
  font-size:15px; font-weight:bold; letter-spacing:.12em; text-transform:uppercase; line-height:1.3;
}

/* ============ MAIN BODY ============ */
.main-body{
  background:var(--bg);
  background-image:
    radial-gradient(circle, rgba(120,10,80,.6) 1px, transparent 1px),
    radial-gradient(circle, rgba(100,5,65,.4) 1px, transparent 1px);
  background-size:40px 40px, 20px 20px;
  background-position:0 0, 10px 10px;
}

.section{ padding:36px 20px 0; max-width:1200px; margin:0 auto; }

.section-heading{
  text-align:center; font-size:15px; font-weight:normal; letter-spacing:.25em;
  text-transform:uppercase; color:#fff; margin-bottom:10px;
}
.section-underline{
  width:120px; height:1px; background:rgba(255,255,255,.35); margin:0 auto 22px;
}

/* ============ CATEGORY GRID ============ */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  grid-auto-rows:170px;
  width:100%;
  gap:0;
}

.card{
  position:relative; overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:16px 18px; color:#fff;
  transition: background-color .2s ease, color .2s ease;
  border:none; text-align:left; font-family:inherit;
}
.card > *{ position:relative; z-index:1; }
.card:hover{ background:#fff !important; color:#000 !important; }
.card:hover .title, .card:hover .subtitle, .card:hover .tag{ color:#000; }

.tag{
  font-size:8px; letter-spacing:.18em; text-transform:uppercase;
  color:rgba(255,255,255,.85); margin-bottom:8px; font-weight:bold;
}
.title{
  font-size:16px; font-weight:bold; letter-spacing:.06em;
  text-transform:uppercase; line-height:1.2;
}
.subtitle{
  margin-top:8px; font-size:10px; letter-spacing:.08em;
  line-height:1.5; color:rgba(255,255,255,.85);
}

.yellow{ background:var(--panel-yellow); }
.green{ background:var(--panel-green); }
.blue{ background:var(--panel-blue); }
.red{ background:var(--panel-red); }
.orange{ background:#d05a18; }
.magenta{ background:#b81868; }

.footer-space{ height:48px; }

/* ============ CATEGORY DETAIL ============ */
.menu-detail{
  display:none;
  max-width:900px;
  margin:0 auto;
  padding:0 20px 60px;
}
.menu-detail.active{ display:block; }
.grid-wrap.hidden{ display:none; }

.back-btn{
  display:inline-flex; align-items:center; gap:8px;
  background:none; border:none; color:#fff; cursor:pointer;
  font-family:inherit; font-size:11px; letter-spacing:.15em;
  text-transform:uppercase; margin-bottom:24px; opacity:.85;
  padding:0;
}
.back-btn:hover{ opacity:1; text-decoration:underline !important; }

.detail-heading{
  display:flex; align-items:center; gap:14px;
  margin-bottom:6px;
}
.detail-tag{
  font-size:10px; letter-spacing:.22em; text-transform:uppercase;
  padding:4px 10px; border-radius:2px; font-weight:bold;
}
.detail-title{
  font-size:26px; font-weight:bold; letter-spacing:.06em; text-transform:uppercase;
}
.detail-underline{
  width:60px; height:2px; margin:14px 0 28px;
}

.protein-box{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  padding:16px 20px;
  margin-bottom:28px;
}
.protein-box h3{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  margin-bottom:12px; color:rgba(255,255,255,.85);
}
.protein-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:6px 24px;
  font-size:12.5px;
}
.protein-grid span{ color:rgba(255,255,255,.7); }
.protein-grid b{ float:right; color:#fff; }
.protein-note{
  font-size:11px; color:rgba(255,255,255,.6); margin-top:12px; line-height:1.5;
}

.dish{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:16px; padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.dish:last-child{ border-bottom:none; }
.dish-name{
  font-size:14.5px; font-weight:bold; letter-spacing:.02em;
}
.dish-desc{
  font-size:12px; color:rgba(255,255,255,.65); margin-top:4px; line-height:1.5;
  max-width:520px;
}
.dish-price{
  font-size:14.5px; font-weight:bold; white-space:nowrap; padding-left:12px;
}
.dish-price.from::before{ content:'desde '; font-weight:normal; font-size:11px; color:rgba(255,255,255,.6); }

/* ============ RESPONSIVE ============ */
@media (max-width: 900px){
  .grid{ grid-template-columns:1fr 1fr; }
  .span-2, .span-3, .tall-2{ grid-column:span 1; grid-row:span 1; }
}
@media (max-width: 768px){
  .hero{ min-height:auto; }
  .hero-panels{
    position:relative; left:auto; bottom:auto; transform:none;
    width:100%; flex-direction:column;
  }
  .panel-orange, .panel-magenta{ width:100%; }
  .grid{ grid-template-columns:1fr; grid-auto-rows:150px; }
  .dish{ flex-direction:column; }
  .dish-price{ padding-left:0; }
  .protein-grid{ grid-template-columns:1fr; }
}
</style>
</head>

const grid = document.getElementById('category-grid');
CATEGORIES.forEach((cat, i) => {
  const color = COLORS[i % COLORS.length];
  const btn = document.createElement('button');
  btn.className = `card ${color}`;
  btn.onclick = () => openCategory(cat.id);
  btn.innerHTML = `
    <div class="tag">${cat.tag}</div>
    <div class="title">${cat.title}</div>
    <div class="subtitle">${cat.sub}</div>
  `;
  grid.appendChild(btn);
});

function renderProteinTable(list, groupLabel){
  const rows = list.map(([name, price]) =>
    `<div><span>${name}</span><b>${price}</b></div>`
  ).join('');
  return `
    <div class="protein-box">
      <h3>Elige tu proteína — ${groupLabel}</h3>
      <div class="protein-grid">${rows}</div>
      <div class="protein-note">Todos los curries y biryanis incluyen elección de nivel de picante sin coste extra: Suave, Poco Picante, Picante, Muy Picante o Super Picante.</div>
    </div>
  `;
}

function openCategory(id){
  const cat = CATEGORIES.find(c => c.id === id);
  const idx = CATEGORIES.indexOf(cat);
  const color = COLORS[idx % COLORS.length];
  const colorVarMap = { yellow:'var(--panel-yellow)', green:'var(--panel-green)', blue:'var(--panel-blue)', red:'var(--panel-red)', orange:'#d05a18', magenta:'#b81868' };

  document.getElementById('detail-tag').textContent = cat.tag;
  document.getElementById('detail-tag').style.background = colorVarMap[color];
  document.getElementById('detail-tag').style.color = '#fff';
  document.getElementById('detail-title').textContent = cat.title;
  document.getElementById('detail-underline').style.background = colorVarMap[color];

  const proteinDiv = document.getElementById('detail-protein');
  if (cat.priceGroup === 'curry') {
    proteinDiv.innerHTML = renderProteinTable(PROTEIN_CURRY, 'Curry');
  } else if (cat.priceGroup === 'biryani') {
    proteinDiv.innerHTML = renderProteinTable(PROTEIN_BIRYANI, 'Biryani');
  } else {
    proteinDiv.innerHTML = '';
  }

  const itemsDiv = document.getElementById('detail-items');
  let html = cat.items.map(([name, price, desc]) => {
    const priceClass = price === 'desde' ? 'dish-price from' : 'dish-price';
    const priceText = price === 'desde' ? '' : price;
    return `
      <div class="dish">
        <div>
          <div class="dish-name">${name}</div>
          ${desc ? `<div class="dish-desc">${desc}</div>` : ''}
        </div>
        <div class="${priceClass}">${priceText}</div>
      </div>
    `;
  }).join('');
  if (cat.note) {
    html += `<div class="protein-note" style="margin-top:16px;">${cat.note}</div>`;
  }
  itemsDiv.innerHTML = html;

  document.getElementById('category-grid').classList.add('hidden');
  document.querySelector('.section-heading').style.display = 'none';
  document.querySelector('.section-underline').style.display = 'none';
  document.getElementById('menu-detail').classList.add('active');
  window.scrollTo({ top: document.querySelector('.main-body').offsetTop - 20, behavior:'smooth' });
}

function closeCategory(){
  document.getElementById('menu-detail').classList.remove('active');
  document.getElementById('category-grid').classList.remove('hidden');
  document.querySelector('.section-heading').style.display = '';
  document.querySelector('.section-underline').style.display = '';
}
</script>
